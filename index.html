<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>걷는 동물 테스트</title>
<style>
  body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; }
  #info { position: absolute; top: 10px; left: 10px; color: #fff; z-index: 10; font-size: 14px; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 8px; }
  #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px; }
  button { padding: 12px 20px; font-size: 16px; border-radius: 8px; border: none; background: #4a7; color: white; cursor: pointer; }
  button:active { background: #285; }  #errorBox { position: absolute; top: 50%; left: 10px; right: 10px; transform: translateY(-50%); z-index: 999; background: rgba(200,0,0,0.9); color: white; padding: 16px; border-radius: 8px; font-size: 13px; white-space: pre-wrap; display: none; }
</style>
</head>
<body>
<div id="errorBox"></div>
<script>
window.onerror = function(msg, url, line, col, error) {
  const box = document.getElementById('errorBox');
  box.style.display = 'block';
  box.textContent = '에러 발생:\n' + msg + '\n(줄 ' + line + ')';
  return false;
};
</script>
<div id="info">방향키 또는 버튼으로 이동 / 마우스 드래그로 시점 회전 / 스크롤로 줌<br><span id="arNote">AR은 안드로이드 Chrome에서만 지원됨 (iOS 사파리 불가) / AR 진입 후 화면 탭하면 배치됨</span></div>
<div id="controls">
  <button id="btnWalk">걷기 토글</button>
  <button id="btnSize">크기: 중형</button>
  <button id="btnAR" style="display:none;">📱 AR로 보기</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if (typeof THREE === 'undefined') {
  document.getElementById('errorBox').style.display = 'block';
  document.getElementById('errorBox').textContent = 'Three.js 라이브러리 로딩 실패 (CDN 차단 또는 네트워크 문제)';
  throw new Error('THREE not loaded');
}
try {
  const testCanvas = document.createElement('canvas');
  const gl = testCanvas.getContext('webgl') || testCanvas.getContext('experimental-webgl');
  if (!gl) {
    document.getElementById('errorBox').style.display = 'block';
    document.getElementById('errorBox').textContent = 'WebGL 미지원 브라우저/기기입니다.';
    throw new Error('No WebGL');
  }
} catch(e) {
  document.getElementById('errorBox').style.display = 'block';
  document.getElementById('errorBox').textContent = 'WebGL 컨텍스트 생성 실패: ' + e.message;
}
</script>
<script>
// ---- 기본 씬 ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x88bbdd);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);

// ---- 수동 오빗 카메라 (드래그로 회전, 휠로 줌) ----
let camAngleX = -0.5;   // 상하
let camAngleY = 0.6;    // 좌우
let camDist = 5;
const camTarget = new THREE.Vector3(0, 0.3, 0);

function updateCamera() {
  camera.position.x = camTarget.x + camDist * Math.cos(camAngleX) * Math.sin(camAngleY);
  camera.position.y = camTarget.y + camDist * Math.sin(camAngleX);
  camera.position.z = camTarget.z + camDist * Math.cos(camAngleX) * Math.cos(camAngleY);
  camera.lookAt(camTarget);
}
updateCamera();

let dragging = false, lastX = 0, lastY = 0;
const canvasArea = document; // 전체 문서에서 드래그 감지 (버튼 영역은 아래서 예외처리)
canvasArea.addEventListener('mousedown', e => {
  if (e.target.tagName === 'BUTTON') return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
canvasArea.addEventListener('mouseup', () => dragging = false);
canvasArea.addEventListener('mousemove', e => {
  if (!dragging) return;
  camAngleY -= (e.clientX - lastX) * 0.005;
  camAngleX = THREE.MathUtils.clamp(camAngleX + (e.clientY - lastY) * 0.005, -1.3, 1.3);
  lastX = e.clientX; lastY = e.clientY;
  updateCamera();
});
canvasArea.addEventListener('wheel', e => {
  camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.003, 1.5, 12);
  updateCamera();
});
// 터치 지원
let touchLastX = 0, touchLastY = 0;
canvasArea.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { touchLastX = e.touches[0].clientX; touchLastY = e.touches[0].clientY; }
});
canvasArea.addEventListener('touchmove', e => {
  if (e.touches.length === 1) {
    const dx = e.touches[0].clientX - touchLastX;
    const dy = e.touches[0].clientY - touchLastY;
    camAngleY -= dx * 0.005;
    camAngleX = THREE.MathUtils.clamp(camAngleX + dy * 0.005, -1.3, 1.3);
    touchLastX = e.touches[0].clientX; touchLastY = e.touches[0].clientY;
    updateCamera();
  }
});

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

// ---- WebXR AR 지원 여부 체크 ----
let arSupported = false;
if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-ar').then(supported => {
    arSupported = supported;
    if (supported) document.getElementById('btnAR').style.display = 'inline-block';
    else document.getElementById('arNote').textContent = 'AR 미지원 기기/브라우저 (안드로이드 Chrome에서 열어보세요)';
  }).catch(() => {
    document.getElementById('arNote').textContent = 'AR 지원 확인 실패';
  });
} else {
  document.getElementById('arNote').textContent = 'AR 미지원 기기/브라우저 (안드로이드 Chrome에서 열어보세요)';
}

// 레티클 (탭해서 배치할 위치 표시)
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x44ff88 })
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

let xrSession = null;
let hitTestSource = null;
let hitTestSourceRequested = false;
let hitTestAvailable = true;
let placedInAR = false;

document.getElementById('btnAR').onclick = async () => {
  if (xrSession) return;
  try {
    xrSession = await navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['hit-test']
    });
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(xrSession);
    scene.background = null;
    floor.visible = false;
    grid.visible = false;
    dog.visible = false;
    placedInAR = false;
    hitTestSourceRequested = false;
    hitTestSource = null;
    hitTestAvailable = xrSession.enabledFeatures ? xrSession.enabledFeatures.includes('hit-test') : true;

    const controller = renderer.xr.getController(0);
    controller.addEventListener('select', () => {
      if (placedInAR) return;
      if (hitTestSource && reticle.visible) {
        // 히트테스트 성공: 인식된 바닥 위치에 배치
        dog.visible = true;
        dog.position.setFromMatrixPosition(reticle.matrix);
        placedInAR = true;
        reticle.visible = false;
      } else {
        // 폴백: 히트테스트 미지원 → 카메라 앞 1.2m, 바닥 높이(-0.8m 가정)에 고정 배치
        const camPos = new THREE.Vector3();
        const camDir = new THREE.Vector3();
        camera.getWorldPosition(camPos);
        camera.getWorldDirection(camDir);
        camDir.y = 0;
        camDir.normalize();
        dog.position.copy(camPos).addScaledVector(camDir, 1.2);
        dog.position.y = camPos.y - 0.8;
        dog.visible = true;
        placedInAR = true;
        reticle.visible = false;
      }
    });
    scene.add(controller);

    xrSession.addEventListener('end', () => {
      xrSession = null;
      scene.background = new THREE.Color(0x88bbdd);
      floor.visible = true;
      grid.visible = true;
      dog.visible = true;
      reticle.visible = false;
    });
  } catch (err) {
    console.error(err);
    alert('AR 세션 시작 실패: [' + err.name + '] ' + err.message);
  }
};

// 조명
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(3, 5, 2);
light.castShadow = true;
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// 방바닥 (방 크기 체감용 - 대략 3m x 3m 원룸 느낌)
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 6),
  new THREE.MeshStandardMaterial({ color: 0xdccBa4 })
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(6, 12, 0x888888, 0xaaaaaa);
scene.add(grid);

// ---- 절차적 저폴리 강아지 생성 ----
function buildDog(scale) {
  const dog = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0xa0703a });

  const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.4, 0.35), mat);
  body.position.y = 0.4;
  body.castShadow = true;
  dog.add(body);

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), mat);
  head.position.set(0.55, 0.55, 0);
  head.castShadow = true;
  dog.add(head);

  const snout = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.15), mat);
  snout.position.set(0.75, 0.5, 0);
  dog.add(snout);

  const earGeo = new THREE.BoxGeometry(0.08, 0.15, 0.05);
  [-1, 1].forEach(s => {
    const ear = new THREE.Mesh(earGeo, mat);
    ear.position.set(0.55, 0.7, 0.13 * s);
    dog.add(ear);
  });

  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.08, 0.08), mat);
  tail.position.set(-0.55, 0.55, 0);
  tail.rotation.z = 0.6;
  tail.name = "tail";
  dog.add(tail);

  // 다리 4개 (관절처럼 회전시킬 그룹)
  const legs = [];
  const legPositions = [
    [0.32, 0.15], [0.32, -0.15], [-0.32, 0.15], [-0.32, -0.15]
  ];
  legPositions.forEach((pos, i) => {
    const legGroup = new THREE.Group();
    legGroup.position.set(pos[0], 0.4, pos[1]);
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.1), mat);
    leg.position.y = -0.2;
    leg.castShadow = true;
    legGroup.add(leg);
    dog.add(legGroup);
    legs.push(legGroup);
  });

  dog.userData.legs = legs;
  dog.userData.tail = tail;
  dog.scale.set(scale, scale, scale);
  return dog;
}

let currentScale = 1.0;
let dog = buildDog(currentScale);
scene.add(dog);

// ---- 걷기 상태 ----
let walking = true;
let walkTime = 0;
let heading = 0; // 진행 방향
let keys = {};

document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

document.getElementById('btnWalk').onclick = () => {
  walking = !walking;
};

const sizes = [
  { label: "소형 (5kg급)", scale: 0.6 },
  { label: "중형 (15kg급)", scale: 1.0 },
  { label: "대형 (30kg급)", scale: 1.5 },
];
let sizeIdx = 1;
document.getElementById('btnSize').onclick = () => {
  sizeIdx = (sizeIdx + 1) % sizes.length;
  document.getElementById('btnSize').textContent = "크기: " + sizes[sizeIdx].label;
  scene.remove(dog);
  dog = buildDog(sizes[sizeIdx].scale);
  scene.add(dog);
};

// ---- 애니메이션 루프 (WebXR 호환: setAnimationLoop 사용) ----
const clock = new THREE.Clock();

renderer.setAnimationLoop((timestamp, frame) => {
  const dt = Math.min(clock.getDelta(), 0.1);

  // ---- AR 세션 중이면: 히트테스트로 레티클 갱신 ----
  if (frame && xrSession) {
    const referenceSpace = renderer.xr.getReferenceSpace();
    if (!hitTestSourceRequested) {
      xrSession.requestReferenceSpace('viewer').then(viewerSpace => {
        xrSession.requestHitTestSource({ space: viewerSpace }).then(source => {
          hitTestSource = source;
        }).catch(() => { hitTestSource = null; });
      }).catch(() => { hitTestSource = null; });
      hitTestSourceRequested = true;
    }
    if (hitTestSource && !placedInAR) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);
      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        reticle.visible = true;
        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
      } else {
        reticle.visible = false;
      }
    }
  } else {
    // ---- 데스크톱/모바일 일반 모드: 방향키 이동 ----
    let moveX = 0, moveZ = 0;
    if (keys['ArrowUp']) moveZ -= 1;
    if (keys['ArrowDown']) moveZ += 1;
    if (keys['ArrowLeft']) moveX -= 1;
    if (keys['ArrowRight']) moveX += 1;

    if (moveX !== 0 || moveZ !== 0) {
      heading = Math.atan2(moveX, moveZ);
      dog.rotation.y = heading;
      dog.position.x += Math.sin(heading) * dt * 1.2;
      dog.position.z += Math.cos(heading) * dt * 1.2;
      dog.position.x = THREE.MathUtils.clamp(dog.position.x, -2.7, 2.7);
      dog.position.z = THREE.MathUtils.clamp(dog.position.z, -2.7, 2.7);
    }
  }

  // ---- 다리 걷기 애니메이션 (AR 배치 후에도 그 자리에서 걷는 느낌으로 계속 재생) ----
  if (walking && (!xrSession || placedInAR)) {
    walkTime += dt * 6;
    const legs = dog.userData.legs;
    if (legs) {
      legs[0].rotation.x = Math.sin(walkTime) * 0.5;
      legs[3].rotation.x = Math.sin(walkTime) * 0.5;
      legs[1].rotation.x = Math.sin(walkTime + Math.PI) * 0.5;
      legs[2].rotation.x = Math.sin(walkTime + Math.PI) * 0.5;
    }
    if (dog.userData.tail) {
      dog.userData.tail.rotation.y = Math.sin(walkTime * 1.5) * 0.3;
    }
  }

  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
